<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div id="content-area">Content will load here...</div>
<button onclick="loadRemotePage()">Load Page</button>

<script>
    alert('This is the master page. Click the button to load the remote page.');
    
async function loadRemotePage() {
    const container = document.getElementById('content-area');
    
    try {
        const response = await fetch('remote-page.html');
        const text = await response.json(); // If you use your JSON method
        // Or if fetching raw HTML:
        const html = await response.text();

        // 1. Inject the HTML
        container.innerHTML = html;

        // 2. Find and execute the scripts
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            
            // Copy all attributes (src, type, etc.)
            Array.from(oldScript.attributes).forEach(attr => {
                newScript.setAttribute(attr.name, attr.value);
            });

            // Copy the inline code if there is any
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            
            // Append to the document to execute
            document.body.appendChild(newScript);
            
            // Optional: Remove the original script tag to keep it clean
            oldScript.parentNode.removeChild(oldScript);
        });
    } catch (err) {
        console.error('Failed to load page:', err);
    }
}
</script>

</body>
</html>
