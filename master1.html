<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <header id="header">
        <h1 id="sitetitle">My App</h1>
        <span id="sitemotto">Welcome, User!</span>
    </header>

    <nav id="navmenu">
        <ul id="ulmenu">
            <li><a href="newindex.html" onclick="loadContent(event)">Home</a></li>
            <li><a href="about.html" onclick="loadContent(event)">About</a></li>
            <li><a href="contact.html" onclick="loadContent(event)">Contact</a></li>
        </ul>
    </nav>

    <main id="contentarea">
        
        <aside id="sidebar">
            <h2>Sidebar</h2>
            <p>This is the sidebar content.</p>
        </aside>

        <section id="content">

        </section>

    </main>

    <footer id="footer">
        <p>&copy; <script>document.write(new Date().getFullYear())</script> My App</p>
    </footer>

    <!-- js code for content loading -->
    <script>
        async function loadContent(e, targetId='content') {
            e.preventDefault();      //click takes priority, prevent url navigation
            var url = e.target.href; //alert(url); //get element, then href
            const target = document.getElementById(targetId);
            
            try {
                const response = await fetch(url);
                const htmlText = await response.text();
                
                // Use DOMParser to handle the incoming string
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // 1. Clear current content and inject new HTML (minus scripts)
                target.innerHTML = '';
                const bodyContent = doc.body.innerHTML;
                target.innerHTML = bodyContent;

                // 2. Extract and execute scripts manually
                const scripts = doc.querySelectorAll('script');
                for (const oldScript of scripts) {
                    const newScript = document.createElement('script');
                    
                    // Copy attributes (src, type, etc.)
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });

                    // Copy inline code
                    newScript.textContent = oldScript.textContent;
                    
                    // Append to body to trigger execution
                    document.body.appendChild(newScript);
                }

                // 3. Manually dispatch standard events to trigger 'onload' listeners
                // This ensures scripts waiting for these events will execute
                document.dispatchEvent(new Event('DOMContentLoaded'));
                window.dispatchEvent(new Event('load'));

            } catch (error) {
                console.error('Error loading content page:', error);
            }
        }
    </script>

</body>
</html>

<!--

2. The Content Page Structure --HTML Content Page Sample --
* Since we are dispatching events manually, your content pages can use standard event listeners exactly like a normal standalone page.

<h2>Welcome to the Dashboard</h2>
<script>
    // This will now fire when the function triggers dispatchEvent
    document.addEventListener('DOMContentLoaded', () => {
        console.log("Dashboard DOM is ready!");
    });

    window.addEventListener('load', () => {
        console.log("Dashboard Window has loaded!");
    });
</script>

Key Technical Details
---------------------
* The Script "Re-birth": Browsers do not execute <script> tags inserted via innerHTML. By creating a newScript element and appending it to document.body, we force the browser to evaluate and execute the code.

* Event Dispatching: document.dispatchEvent(new Event('DOMContentLoaded')) mimics the browser's native lifecycle. Any code in your content page wrapped in these listeners will "think" a fresh page load just happened.

* Cleanup: In a production environment, you might want to remove the manually added scripts from the body after execution to prevent the DOM from becoming cluttered with duplicate tags every time you switch pages.

-->
