<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <div class="content">
    <h1>Welcome to the Home Page</h1>
    <p>This content was loaded dynamically.</p>
</div>

    <script>
        // This function mimics "DOMContentLoaded" for the sub-page
        function initContentPage() {
            console.log("Content Page Scripts Initialized.");
            // Your logic here (e.g., binding buttons, loading your country JSON, etc.)
        }

        // Listen for the custom event triggered by the Master Page
        document.addEventListener('ContentPageReady', initContentPage, { once: true });

        // Fallback for direct loads (if applicable)
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initContentPage();
        }
    </script>


</body>
</html>
