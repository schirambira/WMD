<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Welcome to the Dashboard</h2>
    <script>
        // This will now fire when the function triggers dispatchEvent
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Dashboard DOM is ready!");
        });

        window.addEventListener('load', () => {
            console.log("Dashboard Window has loaded!");
        });
    </script>
    
</body>
</html>
